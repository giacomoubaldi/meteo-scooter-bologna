name: Aggiorna benzina Bologna (MIMIT)
on:
  schedule:
    # 08:00, 09:00, 10:00 Europe/Rome (CET/CEST).
    # GitHub cron uses UTC: guard below skips out-of-window runs.
    - cron: '0 6-9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fuel-bologna
  cancel-in-progress: false
jobs:
  update-fuel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controlla ora italiana
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          HOUR=$(TZ=Europe/Rome date +%H)
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$HOUR" == "08" || "$HOUR" == "09" || "$HOUR" == "10" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Scarica prezzi MIMIT e calcola media Bologna
        if: steps.clock.outputs.run == 'true'
        run: python fuel_price.py
      - name: Pubblica JSON per GitHub Pages
        if: steps.clock.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/fuel-price.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna benzina Bologna dai CSV MIMIT"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
