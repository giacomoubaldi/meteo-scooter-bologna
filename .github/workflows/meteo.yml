name: Meteo scooter serale
on:
  schedule:
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
jobs:
  mail:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aggiorna prezzo benzina da OpenCarburanti
        run: |
          python fetch_fuel_page.py
          if ! git diff --quiet -- docs/fuel-price.json || [ -n "$(git ls-files --others --exclude-standard docs/fuel-price.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/fuel-price.json
            git commit -m "Update Bologna petrol price from OpenCarburanti"
            git push
          fi
      - name: Invia previsioni
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: giacomoubaldi@gmail.com
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: python send_email.py
